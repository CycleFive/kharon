[package]
name = "kharon-bwcrypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aes = "0.8"
argon2 = { version = "0.5", features = ["zeroize"] }
base64ct = { version = "1", features = ["alloc"] }
cbc = { version = "0.1", features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = "0.12"
rsa = { version = "0.9", features = ["pem"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"
# OS randomness for EncString IVs (REQ-CRY-002): the public encrypt
# API draws its own IV, so callers cannot reuse one.
getrandom = "0.2"

[dev-dependencies]
serde_json = "1"
trybuild = "1"
