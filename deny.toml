# cargo-deny configuration (spec issue 1: CI runs fmt, clippy, deny, test).
#
# The license allowlist is load-bearing for kharon: it mechanically keeps the
# dependency tree inside the MIT/Apache-2.0-compatible set. See SPEC OQ-2 —
# the Bitwarden SDK License must never slip in through a transitive dep.

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BlueOak-1.0.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
