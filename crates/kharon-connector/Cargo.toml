[package]
name = "kharon-connector"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Agent-initiated TLS reverse transport (kharon path B, OQ-14)"

[dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
thiserror = "2"
zeroize = "1"
sha2 = "0.10"
base64ct = { version = "1", features = ["alloc"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
rustls-native-certs = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[dev-dependencies]
rcgen = { version = "0.13", features = ["crypto", "ring"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
