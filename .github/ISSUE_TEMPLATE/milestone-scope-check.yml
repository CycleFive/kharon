name: Milestone Scope Check
description: Midpoint chore — compare open work in `next` to the cycle's exit criteria; cut or defer drift.
title: "[scope] <version>: Scope check"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Midpoint chore. A chore cycle is one release train: the work in the rolling [`next`](https://github.com/CycleFive/kharon/milestone/12) milestone up to one version cut. See `docs/milestone-chores.md`.
        After opening, apply one assignment label: `assigned:nyx`, `assigned:muse`, or `assigned:duet`.
        Labels are trusted only when applied by a collaborator with triage or higher.
        Ping Lothrop in #needs-lothrop only when a decision is required (scope change, slip, or something the chore cannot cut or defer alone).
  - type: input
    id: milestone
    attributes:
      label: Version
      description: The version this cycle will cut from `next`.
      placeholder: v0.7.0
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Assigned agent
      description: Must match the `assigned:<agent>` label you apply after opening.
      options:
        - nyx
        - muse
        - duet
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: List open issues in `next` against the exit criteria recorded in this cycle's Groom issue.
        - label: Identify drift (out of scope, unneeded, or unbounded).
        - label: Cut or defer drift (close it, or leave it in `next` explicitly marked for a later cycle).
        - label: "Flag Lothrop in #needs-lothrop only if a decision is needed; otherwise finish the chore without a ping."
        - label: Record midpoint status (on track / at risk / slipping) and what changed.
  - type: textarea
    id: status
    attributes:
      label: Midpoint status
      description: "On track / at risk / slipping. What still maps to exit criteria, what was cut or deferred, and any decision needed."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links to issues deferred or closed, and any decision request for Lothrop.
