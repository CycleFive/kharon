name: fixture
# Live Vaultwarden fixture job (issue #10, REQ-DEP-002 /
# REQ-CRY-004 live half): compose up, seed, then the live tests,
# including the headless-Chromium fill E2E (REQ-DEP-002's browser
# half). Manual + fixture-path changes only: the normal `ci` job
# already covers the offline fixture tests, and this job needs Docker
# service startup + the official `bw` CLI oracle.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/kharon-bwcrypto/tests/fixtures/vaultwarden/**"
      - "crates/kharon-bwcrypto/tests/req_dep_002_fixture.rs"
      - "crates/kharon-bwcrypto/src/**"
      - ".github/workflows/fixture.yml"
      - "crates/kharond/src/sync/**"
      - "crates/kharond/tests/req_cry_005_sync.rs"
      - "crates/kharond/tests/req_cry_008_009_live_sync.rs"
      - "crates/kharond/tests/req_cry_009_notifications_hub.rs"
      - "crates/kharond/tests/req_cry_009_daemon_live_sync.rs"
      # REQ-DEP-002 browser half: the fill path it drives end to end.
      - "crates/kharond/tests/req_dep_002_chromium_e2e.rs"
      - "crates/kharond/src/cdp/**"
      - "crates/kharond/src/api/fill.rs"
      - "crates/kharond/src/daemon.rs"
      # REQ-EXP-001 bw-export half (issue #84).
      - "crates/kharond/tests/req_exp_loader.rs"
      - "crates/kharond/tests/fixtures/export/**"
      - "crates/kharond/src/export.rs"
permissions: { contents: read }
jobs:
  vaultwarden-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/kharon-bwcrypto/tests/fixtures/vaultwarden
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "cryptography==43.0.3" "argon2-cffi==23.1.0"
      - name: Generate the throwaway loopback TLS cert
        # bw refuses plain-HTTP servers (InsecureUrlNotAllowedError),
        # so the fixture serves HTTPS on 127.0.0.1 with a per-run cert
        # signed by a per-run CA (gitignored, never committed). A CA is
        # needed because rustls rejects a self-signed CA:TRUE cert as
        # the server cert (CaUsedAsEndEntity).
        run: sh gen-tls.sh
      - name: Start Vaultwarden fixture
        run: docker compose up -d
      - name: Seed org / collection / items and capture sync
        run: >-
          python3 seed.py --live --base-url https://127.0.0.1:8222
          --ca-cert "$PWD/tls/ca.pem"
          --out "${{ runner.temp }}/sync.live.json"
          --api-key-out "${{ runner.temp }}/api-key.json"
      - name: Oracle check with the official bw CLI
        # bw get item for BOTH seeded items, compared field-by-field
        # (name, username, password, URI) against fixture.json — the
        # manifest is read here, credentials are not duplicated in env.
        run: |
          export NODE_EXTRA_CA_CERTS="$PWD/tls/ca.pem"
          # bw is PINNED: 2026.2+ moved password login into the Rust
          # SDK, whose prelogin call (POST
          # /identity/accounts/prelogin/password) the spec-pinned
          # Vaultwarden 1.33.0 does not route — login dies with a 404
          # before it starts. 2026.1.0 is the last release whose
          # prelogin is POST /api/accounts/prelogin, which 1.33.0
          # serves. Unpin only together with the server pin.
          npm install -g @bitwarden/cli@2026.1.0
          bw config server https://127.0.0.1:8222
          read -r BW_EMAIL BW_PASSWORD <<< "$(python3 -c '
          import json
          a = json.load(open("fixture.json"))["account"]
          print(a["email"], a["password"])')"
          # Password via env, not argv; session capture split from the
          # export so a login failure fails at the login (export alone
          # succeeds under bash -e and masks the exit status).
          export BW_PASSWORD
          BW_SESSION="$(bw login "$BW_EMAIL" --passwordenv BW_PASSWORD --raw)"
          export BW_SESSION
          unset BW_PASSWORD
          bw sync
          bw list items > "${{ runner.temp }}/bw-items.json"
          python3 - "${{ runner.temp }}/bw-items.json" <<'EOF'
          import json, subprocess, sys
          manifest = json.load(open("fixture.json"))
          listed = {i["name"]: i["id"] for i in json.load(open(sys.argv[1]))}
          for want in manifest["items"]:
              assert want["name"] in listed, f"bw did not list {want['name']}"
              got = json.loads(subprocess.run(
                  ["bw", "get", "item", listed[want["name"]]],
                  capture_output=True, text=True, check=True).stdout)
              login = got["login"]
              assert got["name"] == want["name"], got["name"]
              assert login["username"] == want["username"], want["name"]
              assert login["password"] == want["password"], want["name"]
              assert login["uris"][0]["uri"] == want["uri"], want["name"]
          print("bw oracle: both items match fixture.json (name/username/password/uri)")
          EOF
      - name: Live REQ-CRY-004 decrypt against the captured sync
        working-directory: ${{ github.workspace }}
        env:
          KHARON_FIXTURE_SYNC_JSON: ${{ runner.temp }}/sync.live.json
        run: cargo test -p kharon-bwcrypto --test req_dep_002_fixture req_cry_004_live -- --ignored
      - name: Live REQ-CRY-005 API-key login + sync + scoped decrypt (kharond)
        working-directory: ${{ github.workspace }}
        env:
          KHARON_FIXTURE_BASE_URL: https://127.0.0.1:8222
          KHARON_FIXTURE_CA_CERT: ${{ github.workspace }}/crates/kharon-bwcrypto/tests/fixtures/vaultwarden/tls/ca.pem
          KHARON_FIXTURE_API_KEY_JSON: ${{ runner.temp }}/api-key.json
        run: cargo test -p kharond --test req_cry_005_sync req_cry_005_live -- --ignored
      - name: Install headless Chromium (pinned)
        # chrome-headless-shell from the chromedp image, pinned by
        # digest (Chromium 157.0.8103.27): copied out of the image,
        # never run as a container. The runner image already has
        # Chrome's shared libraries.
        working-directory: ${{ runner.temp }}
        run: |
          cid="$(docker create chromedp/headless-shell@sha256:7bee201478b2f6266aae01243740ee85c16281e32f42d3aed9fdf04f4eace7a1)"
          docker cp "$cid:/headless-shell" headless-shell
          docker rm "$cid"
          ./headless-shell/headless-shell --version
      - name: Live REQ-DEP-002 seeded fixture fills a test page through headless Chromium (kharond)
        # Runs while the seeded items are still as seed.py left them
        # (the steps below re-sync and mutate the fixture).
        working-directory: ${{ github.workspace }}
        env:
          KHARON_FIXTURE_BASE_URL: https://127.0.0.1:8222
          KHARON_FIXTURE_CA_CERT: ${{ github.workspace }}/crates/kharon-bwcrypto/tests/fixtures/vaultwarden/tls/ca.pem
          KHARON_FIXTURE_API_KEY_JSON: ${{ runner.temp }}/api-key.json
          KHARON_FIXTURE_CHROMIUM: ${{ runner.temp }}/headless-shell/headless-shell
        run: cargo test -p kharond --test req_dep_002_chromium_e2e -- --ignored
      - name: Live REQ-CRY-008/009 dedicated-org preflight + live re-sync (kharond)
        working-directory: ${{ github.workspace }}
        env:
          KHARON_FIXTURE_BASE_URL: https://127.0.0.1:8222
          KHARON_FIXTURE_CA_CERT: ${{ github.workspace }}/crates/kharon-bwcrypto/tests/fixtures/vaultwarden/tls/ca.pem
          KHARON_FIXTURE_API_KEY_JSON: ${{ runner.temp }}/api-key.json
        run: cargo test -p kharond --test req_cry_008_009_live_sync live -- --ignored
      - name: Live REQ-CRY-009 notifications hub push (add/edit/delete within 10 s)
        working-directory: ${{ github.workspace }}
        env:
          KHARON_FIXTURE_BASE_URL: https://127.0.0.1:8222
          KHARON_FIXTURE_CA_CERT: ${{ github.workspace }}/crates/kharon-bwcrypto/tests/fixtures/vaultwarden/tls/ca.pem
          KHARON_FIXTURE_API_KEY_JSON: ${{ runner.temp }}/api-key.json
        run: cargo test -p kharond --test req_cry_009_notifications_hub req_cry_009_live -- --ignored
      - name: Live REQ-CRY-009 daemon E2E (kharond binary; list reflects add/edit/delete, pid unchanged)
        working-directory: ${{ github.workspace }}
        env:
          KHARON_FIXTURE_BASE_URL: https://127.0.0.1:8222
          KHARON_FIXTURE_CA_CERT: ${{ github.workspace }}/crates/kharon-bwcrypto/tests/fixtures/vaultwarden/tls/ca.pem
          KHARON_FIXTURE_API_KEY_JSON: ${{ runner.temp }}/api-key.json
        run: cargo test -p kharond --test req_cry_009_daemon_live_sync -- --ignored
      - name: Live REQ-CRY-008 second org while unlocked locks (widens the fixture; keep last)
        working-directory: ${{ github.workspace }}
        env:
          KHARON_FIXTURE_BASE_URL: https://127.0.0.1:8222
          KHARON_FIXTURE_CA_CERT: ${{ github.workspace }}/crates/kharon-bwcrypto/tests/fixtures/vaultwarden/tls/ca.pem
          KHARON_FIXTURE_API_KEY_JSON: ${{ runner.temp }}/api-key.json
        run: >-
          cargo test -p kharond --test req_cry_009_notifications_hub
          req_cry_008_live_second_org_while_unlocked_locks -- --ignored --exact
      - name: Rotate the fixture account KDF to Argon2id (issue #84; keep after all other live steps)
        # Password-protected bw exports derive with the account's
        # configured KDF, and the fixture account is seeded PBKDF2 —
        # rotate_kdf.py performs the web vault's KDF change so the
        # export below lands as Argon2id. Irreversible for the
        # fixture: every PBKDF2-deriving helper (seed/mutate, the
        # live tests above) stops working afterwards, so this and
        # the export step run after the second-org step, which is
        # no longer literally last but remains the last step that
        # depends on the fixture as seeded.
        run: >-
          python3 rotate_kdf.py --base-url https://127.0.0.1:8222
          --ca-cert "$PWD/tls/ca.pem"
      - name: Real bw password-protected export loads + unlocks (REQ-EXP-001, issue #84)
        working-directory: ${{ github.workspace }}
        env:
          KHARON_BW_EXPORT_JSON: ${{ runner.temp }}/bw-export.json
        run: |
          export NODE_EXTRA_CA_CERTS="${{ github.workspace }}/crates/kharon-bwcrypto/tests/fixtures/vaultwarden/tls/ca.pem"
          cd crates/kharon-bwcrypto/tests/fixtures/vaultwarden
          # bw was installed by the oracle step (same pin, 2026.1.0).
          # Fresh login after the KDF rotation: this also proves bw
          # can log in with the Argon2id parameters. Password via
          # env, session captured separately so a login failure
          # fails here, as in the oracle step.
          bw logout || true
          bw config server https://127.0.0.1:8222
          read -r BW_EMAIL BW_PASSWORD <<< "$(python3 -c '
          import json
          a = json.load(open("fixture.json"))["account"]
          print(a["email"], a["password"])')"
          export BW_PASSWORD
          # Vaultwarden rate-limits /identity/connect/token, and by
          # this point the job has logged in a lot (seed, oracle,
          # mutate.py per mutation, rotate_kdf.py a minute ago): the
          # first run of this step died here with "Rate limit
          # exceeded. Try again later." Retry with backoff.
          BW_SESSION=""
          for attempt in 1 2 3 4 5 6; do
            if BW_SESSION="$(bw login "$BW_EMAIL" --passwordenv BW_PASSWORD --raw)"; then
              break
            fi
            echo "bw login attempt $attempt failed; retrying in 20 s"
            sleep 20
          done
          [ -n "$BW_SESSION" ] || { echo "bw login never succeeded"; exit 1; }
          export BW_SESSION
          unset BW_PASSWORD
          bw sync
          # The seeded items are org-owned; a personal export would
          # be empty. The org id comes from the seed-time sync
          # capture (its only organization).
          ORG_ID="$(python3 -c '
          import json
          s = json.load(open("${{ runner.temp }}/sync.live.json"))
          print(s["profile"]["organizations"][0]["id"])')"
          # Export password is fixture-only and recorded in
          # crates/kharond/tests/req_exp_loader.rs (issue #84).
          bw export --organizationid "$ORG_ID" --format encrypted_json \
            --password "kharon bw export fixture password 4" \
            --output "$KHARON_BW_EXPORT_JSON"
          cd "${{ github.workspace }}"
          cargo test -p kharond --test req_exp_loader req_exp_001_bw_produced_argon2id_export_loads_and_unlocks -- --ignored --exact
      - name: Tear down fixture (including its data volume)
        if: always()
        run: docker compose down -v
