name: Milestone Scope Check
description: Mid gate. Runs when the trigger the Groom defined fires. Test the Groom's assumptions, and cut or defer anything that has drifted.
title: "[scope] <milestone>: Scope check"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Mid gate. The Groom defined this check's trigger (a date or an event) and wrote it below. While this check is open past its trigger, no new work is claimed in the milestone; in-flight PRs land. See `docs/milestone-chores.md`.
        Put this issue in the milestone it checks. After opening it, apply one assignment label: `assigned:nyx`, `assigned:muse`, or `assigned:duet`.
        A label counts only when a collaborator with triage access or higher applied it.
        Ping Lothrop in #needs-lothrop only when a decision is required: a scope change, a slip, or something this chore can't cut or defer on its own.
  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: The title of the milestone this chore belongs to.
      placeholder: M6 — teach mode
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Assigned agent
      description: This must match the `assigned:<agent>` label you apply after opening the issue.
      options:
        - nyx
        - muse
        - duet
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: Trigger
      description: The date or event that starts this check, written by the Groom when it closes — for example "2026-12-15", "when the canary issue closes", or "when three of the five child issues are closed".
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Confirm the trigger has fired (the date has arrived or the event has happened).
        - label: Check the milestone's open issues against its exit criteria.
        - label: Test the Groom's assumptions — its scope calls, ordering, and sizing — against what has actually happened, and note where they were wrong.
        - label: Identify drift, meaning work that's out of scope, unneeded, or unbounded.
        - label: Cut or defer the drift by closing it or moving it back to `next`.
        - label: "Flag Lothrop in #needs-lothrop only if a decision is needed. Otherwise finish the chore without a ping."
        - label: Record the midpoint status (on track, at risk, or slipping) and what changed, and adjust the due date only with a stated reason.
        - label: Take over the consequences ledger forwarded from the Groom issue (below) and update each item's status.
        - label: "Close this issue, forwarding the consequences below, statuses updated, to the Close-out issue. From then on the Close-out's copy is the only living one, and the milestone's goal is Close-out."
  - type: textarea
    id: status
    attributes:
      label: Midpoint status
      description: "On track, at risk, or slipping. What still maps to the exit criteria, what was cut or deferred, and any decision needed."
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: The consequences ledger forwarded from the Groom issue, one per line with its current status. Forwarded to the Close-out when this issue closes. Write "none" if the Groom listed none.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links to issues that were deferred or closed, and any decision request for Lothrop.
