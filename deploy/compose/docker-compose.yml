# kharon compose package (SPEC §9; issues #24, #207; REQ-DEP-001, 002, 006).
#
# Managed default: kharond beside cloudflared, against the customer's
# Bitwarden cloud vault, with no inbound port on the host. Both join
# the network namespace of `holder`, a do-nothing container, so
# in the base kharond's listeners are on 127.0.0.1 and only cloudflared (tunnel
# route http://127.0.0.1:8790) can reach them. The holder exists
# because a container that joins `service:kharon` is stranded when
# kharond restarts; the holder never restarts for that.
#
# Copy kharon.toml.example to kharon.toml and fill it in. Secrets
# (README: Compose keeps the host file's owner and mode):
#   secrets/kharon_bw_api_key.json        uid 10001, mode 0400
#   secrets/cloudflared_tunnel_token      uid 65532, mode 0400
#
#   docker compose --profile edge up -d --build
#   docker compose exec kharon kharon unlock     # master password, once
#
# Profiles: `edge` is cloudflared; `vaultwarden` is a self-hosted
# vault (set [bitwarden] server = "http://vaultwarden:80").
# compose.vpn.yml adds the `wg` network (holder 10.66.0.1, agent host
# 10.66.0.2) for a WireGuard link to the agent host's browser.
# CI layers: -f docker-compose.yml -f compose.vpn.yml
# -f e2e/compose.e2e.yml (.github/workflows/image.yml).
name: kharon

services:
  holder:
    image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Mapping form so overlays can add networks (compose.vpn.yml).
    networks: { default: {} }
    # No published ports: nothing listens beyond the namespace.

  vaultwarden:
    image: vaultwarden/server:1.33.0
    profiles: [vaultwarden]
    restart: unless-stopped
    volumes: ["vaultwarden-data:/data"]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.4@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515
    profiles: [edge]
    restart: unless-stopped
    network_mode: "service:holder"
    # --metrics keeps the metrics listener on loopback (it would
    # otherwise bind 0.0.0.0). The token is a secret file, never argv
    # or environment.
    command: ["tunnel", "--metrics", "127.0.0.1:20241", "run", "--token-file", "/run/secrets/cloudflared_tunnel_token"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    secrets: [cloudflared_tunnel_token]

  kharon:
    build: { context: ../.. }
    image: kharon:local
    restart: unless-stopped
    # SPEC §9 hardening. read_only works because kharond writes only
    # to /data (REQ-DEP-001). Note: with a non-root `user`, Docker does
    # not raise CAP_IPC_LOCK into the effective set, so mlock
    # (REQ-MEM-002) rests on the unlimited memlock ulimit; the cap is
    # kept as SPEC lists it. seccomp=./kharon-seccomp.json is the
    # Docker/moby default profile checked in under the SPEC §9 name
    # (see README); tighten later by forking that file.
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    cap_add: [IPC_LOCK]
    ulimits: { memlock: -1, core: 0 }
    security_opt: ["no-new-privileges:true", "seccomp=./kharon-seccomp.json"]
    volumes:
      - "kharon-data:/data"
      - "./kharon.toml:/etc/kharon.toml:ro"
    secrets: [kharon_bw_api_key]
    network_mode: "service:holder"
    # No published ports: the owner talks to the unix socket in /data
    # (`kharon` CLI above).

secrets:
  kharon_bw_api_key:
    file: ./secrets/kharon_bw_api_key.json
  cloudflared_tunnel_token:
    file: ./secrets/cloudflared_tunnel_token

volumes:
  vaultwarden-data: {}
  kharon-data: {}
