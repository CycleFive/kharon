name: Milestone Groom
description: Start-of-cycle chore — write, size, label, and order work in `next`; set scope and exit criteria.
title: "[groom] <version>: Groom"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Start-of-cycle chore. A chore cycle is one release train: the work in the rolling [`next`](https://github.com/CycleFive/kharon/milestone/12) milestone up to one version cut. See `docs/milestone-chores.md`.
        After opening, apply one assignment label: `assigned:nyx`, `assigned:muse`, or `assigned:duet`.
        Labels are trusted only when applied by a collaborator with triage or higher.
  - type: input
    id: milestone
    attributes:
      label: Version
      description: The version this cycle will cut from `next`.
      placeholder: v0.7.0
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Assigned agent
      description: Must match the `assigned:<agent>` label you apply after opening.
      options:
        - nyx
        - muse
        - duet
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Write issues in `next` that cover the intended scope of this cycle (and only that scope).
        - label: Size each issue.
        - label: Apply type/priority labels and put issues in delivery order.
        - label: Record this cycle's scope and exit criteria in the Scope field below.
        - label: Triage leftovers in `next` from the prior cycle so they are in or out on purpose.
        - label: Confirm the `assigned:<agent>` label matches the dropdown. Do not use the label as a substitute for GitHub assignees.
  - type: textarea
    id: scope
    attributes:
      label: Scope and exit criteria
      description: Paste or write this cycle's scope and the conditions under which the version is ready to cut.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Sizing questions, deferred items, links to the board or project.
