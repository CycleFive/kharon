name: fixture
# Live Vaultwarden fixture job (issue #10, REQ-DEP-002 part /
# REQ-CRY-004 live half). Manual + fixture-path changes only: the
# normal `ci` job already covers the offline fixture tests, and this
# job needs Docker service startup + the official `bw` CLI oracle.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/kharon-bwcrypto/tests/fixtures/vaultwarden/**"
      - "crates/kharon-bwcrypto/tests/req_dep_002_fixture.rs"
      - ".github/workflows/fixture.yml"
permissions: { contents: read }
jobs:
  vaultwarden-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/kharon-bwcrypto/tests/fixtures/vaultwarden
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "cryptography==43.0.3"
      - name: Start Vaultwarden fixture
        run: docker compose up -d
      - name: Seed org / collection / items and capture sync
        run: python3 seed.py --live --base-url http://127.0.0.1:8222 --out "${{ runner.temp }}/sync.live.json"
      - name: Oracle check with the official bw CLI
        env:
          BW_EMAIL: kharon-fixture@example.com
          BW_PASSWORD: "kharon fixture password 10"
        run: |
          npm install -g @bitwarden/cli
          bw config server http://127.0.0.1:8222
          export BW_SESSION="$(bw login "$BW_EMAIL" "$BW_PASSWORD" --raw)"
          bw sync
          # Both seeded items must decrypt via bw to the manifest names.
          bw list items --organizationid "$(bw list organizations | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])')" \
            | python3 -c 'import json,sys; names=sorted(i["name"] for i in json.load(sys.stdin)); assert names==["fixture-no-cipher-key","fixture-with-cipher-key"], names'
      - name: Live REQ-CRY-004 decrypt against the captured sync
        working-directory: ${{ github.workspace }}
        env:
          KHARON_FIXTURE_SYNC_JSON: ${{ runner.temp }}/sync.live.json
        run: cargo test -p kharon-bwcrypto --test req_dep_002_fixture req_cry_004_live -- --ignored
      - name: Tear down fixture (including its data volume)
        if: always()
        run: docker compose down -v
