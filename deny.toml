# cargo-deny configuration (spec issue 1: CI runs fmt, clippy, deny, test).
#
# The license allowlist is load-bearing for kharon: it mechanically keeps the
# dependency tree inside the MIT/Apache-2.0-compatible set. See SPEC OQ-2 —
# the Bitwarden SDK License must never slip in through a transitive dep.

[advisories]
version = 2
ignore = [
    # RUSTSEC-2023-0071 (Marvin attack): timing side-channel in the `rsa`
    # crate's private-key operations. No patched release exists (all
    # released versions are affected), so accepting it is the only way to
    # use the canonical RustCrypto RSA implementation at all. kharon's
    # exposure is narrow: RSA decryption happens locally, at unwrap time,
    # on ciphertexts served by the account's own Vaultwarden — the broker
    # exposes no decryption endpoint, so an attacker cannot submit chosen
    # ciphertexts or take the repeated timing measurements the attack
    # needs. Revisit the moment `rsa` ships a fixed release; the ignore
    # must be removed then. (Added 2026-10-30 with issue #6.)
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BlueOak-1.0.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
