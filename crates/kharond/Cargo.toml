[package]
name = "kharond"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
ed25519-dalek = "2.1"
rand = "0.8"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
fs2 = "0.4"
publicsuffix = "2.3"
url = "2"
# CDP client (issue #17, REQ-ARCH-002/003/005, REQ-ORG-002..005).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "fs", "sync"] }
# TLS is terminated in-crate (cdp::tls, pinned peer certs) before the
# websocket handshake, so the client needs no TLS feature of its own.
tokio-tungstenite = "0.24"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12", "logging", "std"] }
futures-util = { version = "0.3", features = ["sink"] }

zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.13", features = ["crypto", "ring"] }
