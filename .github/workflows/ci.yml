name: ci
on:
  push: { branches: [master] }
  pull_request:
permissions: { contents: read }
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck deploy/checks
        run: shellcheck --severity=warning deploy/checks/*.sh
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: EmbarkStudios/cargo-deny-action@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # #220 item 1: the 20 s mux ping (PING_INTERVAL) across an idle
      # period. 25 s of real time, so it stays out of the default run.
      - name: req_arch_002 idle ws session keepalive (25 s)
        # bash is `-eo pipefail`: the test's exit status survives `tee`. The
        # grep fails the step if the filter ever matches nothing (libtest
        # exits 0 on "0 passed").
        shell: bash
        run: |
          cargo test -p kharond --test req_arch_002_ws_relay -- --ignored --exact idle_session_keeps_messages_flowing | tee keepalive.log
          grep -q '^test result: ok. 1 passed' keepalive.log
      # REQ-EXP-001 (#85): hosted runners refuse unprivileged userns, so the
      # plain run above skips the no-egress AC. Re-run that one test as root
      # (prebuilt binary; no root cargo) with KHARON_REQUIRE_NETNS=1, which
      # turns any skip into a failure.
      - name: req_exp_001 no-egress netns (privileged)
        shell: bash # -eo pipefail: the test's exit status survives `tee`
        run: |
          bin=$(cargo test -p kharond --test req_mem_daemon_unlock --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "req_mem_daemon_unlock" and .executable != null) | .executable')
          test -x "$bin"
          sudo env KHARON_REQUIRE_NETNS=1 "$bin" \
            req_exp_001_export_mode_works_with_no_network_egress --exact --nocapture 2>&1 | tee netns.log
          grep -q '^EXERCISED req_exp_001' netns.log
