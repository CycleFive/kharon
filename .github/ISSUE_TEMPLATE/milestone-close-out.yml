name: Milestone Close-out
description: End-of-cycle chore — verify exit criteria, cut the version from `next`, retro, open the next cycle's chores.
title: "[close-out] <version>: Close-out"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        End-of-cycle chore. A chore cycle is one release train: the work in the rolling [`next`](https://github.com/CycleFive/kharon/milestone/12) milestone up to one version cut. See `docs/milestone-chores.md`.
        After opening, apply one assignment label: `assigned:nyx`, `assigned:muse`, or `assigned:duet`.
        Labels are trusted only when applied by a collaborator with triage or higher.
        `next` never closes. Never force-push.
  - type: input
    id: milestone
    attributes:
      label: Version
      description: The version this cycle cuts from `next`.
      placeholder: v0.7.0
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Assigned agent
      description: Must match the `assigned:<agent>` label you apply after opening.
      options:
        - nyx
        - muse
        - duet
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Verify the train's gate - master is green and something user-visible landed - and every exit criterion is met, or record an explicit waiver.
        - label: Cut the version from `next` as `cycle-five` (tag and release; no force-push).
        - label: Create a milestone named for the version, move the closed issues that shipped in it from `next` into it, and close that version milestone. Leave `next` open.
        - label: Write a short retro (keep / drop / change for the next cycle).
        - label: Open the next cycle's three chore issues (Groom, Scope check, Close-out) from the issue forms.
        - label: Assign those chores by `assigned:<agent>` using the rotation (nyx → muse → duet → nyx); assign three different agents, and do not repeat the same agent on the same chore type as this cycle.
  - type: input
    id: release
    attributes:
      label: Release
      description: Tag, PR, or release URL cut as cycle-five. Leave blank if the gate was not met and nothing was cut.
  - type: textarea
    id: retro
    attributes:
      label: Retro
      description: Short keep / drop / change. Note the agents chosen for the next cycle's three chores.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Waivers, leftover issues still in `next`, links to the version milestone and the next cycle's chore issues.
