name: fuzz
on:
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC
  workflow_dispatch:
permissions: { contents: read }
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [encstring_parse] # REQ-CRY-002: 10 min, 0 crashes
    defaults:
      run:
        working-directory: crates/kharon-bwcrypto
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: crates/kharon-bwcrypto/fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
