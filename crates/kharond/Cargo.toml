[package]
name = "kharond"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
ed25519-dalek = "2.1"
rand = "0.8"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
