[package]
name = "kharon-agent-connector"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Agent-host connector: outbound TLS relay to loopback CDP"

[[bin]]
name = "kharon-agent-connector"
path = "src/main.rs"

[dependencies]
kharon-connector = { version = "0.0.0", path = "../kharon-connector" }
serde = { version = "1.0", features = ["derive"] }
toml = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
zeroize = "1"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }

[dev-dependencies]
rcgen = { version = "0.13", features = ["crypto", "ring"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
