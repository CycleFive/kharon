name: agent-host
# Agent-host provisioning (issue #24): REQ-DEP-005's shell snippet,
# deploy/agent-host/provision.sh, run in a fresh Debian VM under KVM,
# with the runner as the broker at the other end of the WireGuard
# tunnel. REQ-ARCH-001's docs check runs with the workspace tests in
# ci.yml.
on:
  workflow_dispatch:
  push: { branches: [master] }
  pull_request:
    paths:
      - "deploy/agent-host/**"
      - ".github/workflows/agent-host.yml"
permissions: { contents: read }
jobs:
  req_dep_005_vm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=warning deploy/agent-host/provision.sh deploy/agent-host/tests/req_dep_005_vm.sh
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install QEMU, cloud-image-utils and wireguard-tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils wireguard-tools
      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
      - name: REQ-DEP-005 provision a Debian VM and check it
        run: deploy/agent-host/tests/req_dep_005_vm.sh
      - name: Keep the VM's console and provisioning log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: req_dep_005_vm
          path: |
            ${{ runner.temp }}/req_dep_005/console.log
            ${{ runner.temp }}/req_dep_005/provision.log
          if-no-files-found: ignore
