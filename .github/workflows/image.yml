name: image
# kharond image and compose E2E (issue #24):
# - image: REQ-DEP-001 (static, non-root, read-only rootfs, < 30 MB,
#   Trivy 0 high/critical);
# - compose-e2e: the compose example plus its CI overlay against the
#   seeded Vaultwarden fixture, filling through the agent host's
#   headless Chromium (REQ-DEP-002, REQ-DEP-006, REQ-ARCH-004,
#   REQ-GOAL-002);
# - compose-e2e-ws: path B over WebSocket with no VPN (issue #220,
#   REQ-ARCH-002): the agent connector through a fake TLS edge;
# - compose-e2e-oauth: the OAuth Connect flow (issue #234): kharond in
#   public mode behind two fake TLS edges (agent and owner hostnames).
on:
  workflow_dispatch:
  push: { branches: [master] }
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.lock"
      - "deploy/**"
      - "crates/kharond/src/**"
      - "crates/kharon-cli/src/**"
      - "crates/kharond/tests/docker_support/**"
      - "crates/kharond/tests/compose_support/**"
      - "crates/kharond/tests/req_dep_001_image.rs"
      - "crates/kharond/tests/req_dep_002_compose_e2e.rs"
      - "crates/kharond/tests/req_arch_002_compose_ws_e2e.rs"
      - "crates/kharond/tests/req_oau_234_compose_connect_e2e.rs"
      - "crates/kharond/tests/owner_ui_support/**"
      - "crates/kharond/tests/api_support/**"
      - "crates/kharon-agent-connector/**"
      - "crates/kharon-connector/**"
      - "crates/kharond/tests/req_dep_006_compose_package.rs"
      - "crates/kharon-bwcrypto/tests/fixtures/vaultwarden/**"
      - ".github/workflows/image.yml"
permissions: { contents: read }
env:
  KHARON_IMAGE: kharon:e2e
  # Trivy, pinned by digest (0.76.1); it runs as a container against
  # the local Docker daemon.
  TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the image
        run: docker build -t "$KHARON_IMAGE" .
      - name: REQ-DEP-001 Trivy reports 0 high/critical
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY"
          image --severity HIGH,CRITICAL --exit-code 1 --no-progress "$KHARON_IMAGE"
      - name: REQ-DEP-001 size, non-root, no shell, docker run --read-only
        run: cargo test -p kharond --test req_dep_001_image -- --ignored

  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE: >-
        docker compose -f deploy/compose/docker-compose.yml
        -f deploy/compose/compose.vpn.yml
        -f deploy/compose/e2e/compose.e2e.yml -p kharon-e2e
        --profile vaultwarden
      FIXTURE: crates/kharon-bwcrypto/tests/fixtures/vaultwarden
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "cryptography==43.0.3"
      - name: Build the kharond and agent-host images
        run: |
          docker build -t "$KHARON_IMAGE" .
          $COMPOSE build agent-host
      - name: Start and seed the Vaultwarden fixture
        run: |
          sh "$FIXTURE/gen-tls.sh"
          $COMPOSE up -d --no-build vaultwarden
          python3 "$FIXTURE/seed.py" --live --base-url https://127.0.0.1:8222 \
            --ca-cert "$PWD/$FIXTURE/tls/ca.pem" \
            --out "${{ runner.temp }}/sync.live.json" \
            --api-key-out "${{ runner.temp }}/api-key.json"
      - name: N1 compose package (REQ-DEP-006)
        run: cargo test -p kharond --test req_dep_006_compose_package -- --ignored
      - name: Compose E2E (REQ-DEP-002, REQ-DEP-006, REQ-ARCH-004, REQ-GOAL-002)
        env:
          KHARON_FIXTURE_BASE_URL: https://127.0.0.1:8222
          KHARON_FIXTURE_CA_CERT: ${{ github.workspace }}/crates/kharon-bwcrypto/tests/fixtures/vaultwarden/tls/ca.pem
          KHARON_FIXTURE_API_KEY_JSON: ${{ runner.temp }}/api-key.json
        run: cargo test -p kharond --test req_dep_002_compose_e2e -- --ignored
      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: $COMPOSE down -v

  compose-e2e-ws:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # No --env-file here: the project's services that these steps
      # touch (the builds, the Vaultwarden fixture) don't read the
      # connector uid, and its defaults are fine. The test writes
      # run-ws/env and passes it to its own compose calls.
      COMPOSE: >-
        docker compose -f deploy/compose/docker-compose.yml
        -f deploy/compose/e2e/compose.e2e-ws.yml -p kharon-e2e-ws
        --profile vaultwarden
      FIXTURE: crates/kharon-bwcrypto/tests/fixtures/vaultwarden
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "cryptography==43.0.3"
      - name: Build the kharond, agent-host and connector images
        run: |
          docker build -t "$KHARON_IMAGE" .
          $COMPOSE build agent-host connector
      - name: Start and seed the Vaultwarden fixture
        run: |
          sh "$FIXTURE/gen-tls.sh"
          $COMPOSE up -d --no-build vaultwarden
          python3 "$FIXTURE/seed.py" --live --base-url https://127.0.0.1:8222 \
            --ca-cert "$PWD/$FIXTURE/tls/ca.pem" \
            --out "${{ runner.temp }}/sync.live.json" \
            --api-key-out "${{ runner.temp }}/api-key.json"
      - name: Compose E2E, path B over ws (REQ-ARCH-002, REQ-DEP-006, REQ-GOAL-002)
        env:
          KHARON_FIXTURE_BASE_URL: https://127.0.0.1:8222
          KHARON_FIXTURE_CA_CERT: ${{ github.workspace }}/crates/kharon-bwcrypto/tests/fixtures/vaultwarden/tls/ca.pem
          KHARON_FIXTURE_API_KEY_JSON: ${{ runner.temp }}/api-key.json
        run: cargo test -p kharond --test req_arch_002_compose_ws_e2e -- --ignored
      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: $COMPOSE down -v --remove-orphans

  compose-e2e-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # No --env-file: this stack has no connector, so nothing reads the
      # host uid.
      COMPOSE: >-
        docker compose -f deploy/compose/docker-compose.yml
        -f deploy/compose/e2e/compose.e2e-oauth.yml -p kharon-e2e-oauth
        --profile vaultwarden
      FIXTURE: crates/kharon-bwcrypto/tests/fixtures/vaultwarden
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "cryptography==43.0.3"
      - name: Build the kharond and agent-host images
        # The fake edges run socat from the agent-host image; no service
        # of this overlay builds it.
        run: |
          docker build -t "$KHARON_IMAGE" .
          docker build -t kharon-e2e-agent-host:local deploy/compose/e2e/agent-host
      - name: Start and seed the Vaultwarden fixture
        run: |
          sh "$FIXTURE/gen-tls.sh"
          $COMPOSE up -d --no-build vaultwarden
          python3 "$FIXTURE/seed.py" --live --base-url https://127.0.0.1:8222 \
            --ca-cert "$PWD/$FIXTURE/tls/ca.pem" \
            --out "${{ runner.temp }}/sync.live.json" \
            --api-key-out "${{ runner.temp }}/api-key.json"
      - name: Compose E2E, OAuth Connect flow (REQ-OAU, issue #234)
        env:
          KHARON_FIXTURE_BASE_URL: https://127.0.0.1:8222
          KHARON_FIXTURE_CA_CERT: ${{ github.workspace }}/crates/kharon-bwcrypto/tests/fixtures/vaultwarden/tls/ca.pem
          KHARON_FIXTURE_API_KEY_JSON: ${{ runner.temp }}/api-key.json
        run: cargo test -p kharond --test req_oau_234_compose_connect_e2e -- --ignored
      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: $COMPOSE down -v --remove-orphans
