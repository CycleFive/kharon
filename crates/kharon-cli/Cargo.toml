[package]
name = "kharon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kharon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2.1"
# The SIGINT watcher during the tty password prompt: tokio's
# signal handling restores the terminal from a normal thread
# (async-signal-safe by construction), so no signal-hook FFI is
# needed in this crate. `kharon setup` (#404) also runs its one
# login and sync on a current-thread runtime (net, time).
tokio = { version = "1", features = ["rt", "signal", "net", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `kharon setup --answers` (TOML) and the server URL (#404).
toml = "1"
url = "2"
zeroize = { version = "1", features = ["serde"] }
# Terminal echo control for the unlock password prompt (tty, no
# echo; SPEC §8), the owner socket's uid check, and the OS RNG for
# `kharon init`'s master password (REQ-DEP-007), and `fchown` for
# the key file `kharon setup` writes (#404). Safe wrappers only,
# the same rustix kharond already uses.
rustix = { version = "1", default-features = false, features = ["std", "termios", "process", "net", "rand", "fs"] }
kharond = { path = "../kharond", version = "0.0.0" }
kharon-recording = { path = "../kharon-recording", version = "0.0.0" }
# The agent-host bundle (#405): the `[connector]` certificate's pin
# (`pin_of_der`), and a fresh self-signed certificate for it (the
# connector pins the SHA-256 and does not use WebPKI). rcgen is already
# in the tree as a dev-dependency of the connector crates.
kharon-connector = { path = "../kharon-connector", version = "0.0.0" }
rcgen = { version = "0.13", features = ["crypto", "ring"] }

[dev-dependencies]
# The bundle's connector.toml is checked with the connector's own loader.
kharon-agent-connector = { path = "../kharon-agent-connector" }
# Reads the bundle's certificate back to recompute its pin.
rustls-pki-types = { version = "1", features = ["std"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
