[package]
name = "kharond"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_jcs = "0.1"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
httpdate = "1"
hex = "0.4"
ed25519-dalek = "2.1"
rand = "0.8"
thiserror = "2"
# Config loader (issue #5, REQ-DEP-003).
toml = "1"
time = { version = "0.3", features = ["formatting"] }
fs2 = "0.4"
publicsuffix = "2.3"
url = "2"
# CDP client (issue #17, REQ-ARCH-002/003/005, REQ-ORG-002..005).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "fs", "sync", "signal"] }
# TLS is terminated in-crate (cdp::tls, pinned peer certs) before the
# websocket handshake, so the client needs no TLS feature of its own.
tokio-tungstenite = "0.24"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12", "logging", "std"] }
futures-util = { version = "0.3", features = ["sink"] }

zeroize = { version = "1", features = ["zeroize_derive", "serde"] }

# Identity/sync client (issue #8, REQ-CRY-005/007). reqwest without a
# bundled rustls provider: the client config is built in-crate on the
# same aws_lc_rs provider as cdp::tls, with OS roots plus an optional
# extra CA (self-hosted / fixture).
kharon-bwcrypto = { version = "0.0.0", path = "../kharon-bwcrypto" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "http2"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
# Safe wrappers only — kharond forbids unsafe code, so no direct libc
# FFI: geteuid() for the api_key_file ownership check (SPEC §8,
# REQ-DEP-008), prctl/setrlimit/mlockall for process memory hardening
# (issue #11, REQ-MEM-001/002), and clock_gettime(CLOCK_BOOTTIME) for
# the lock timers (REQ-MEM-004). Already in the tree via tempfile.
rustix = { version = "1", default-features = false, features = ["std", "process", "mm", "time"] }
# Agent API (issue #14, REQ-API-002..004/006): HTTP/1.1 server on the
# hyper 1 / tokio stack reqwest already pulls in, and Argon2id agent
# token hashes (same argon2 crate kharon-bwcrypto uses for the KDF).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
argon2 = { version = "0.5", features = ["std", "zeroize"] }
# MCP transport (issue #15, REQ-API-001): tool input schemas generated
# from Rust types (schemars, as SPEC §4 names); raw_value so tool
# arguments keep duplicate keys (refused, as on HTTP); base64ct
# (already in the tree via kharon-bwcrypto) decodes the `Mcp-Name`
# header's `=?base64?…?=` form.
schemars = "1"
base64ct = { version = "1", features = ["alloc"] }

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.13", features = ["crypto", "ring"] }
# Paused clock for the REQ-API-009 deadline tests.
tokio = { version = "1", features = ["test-util"] }
